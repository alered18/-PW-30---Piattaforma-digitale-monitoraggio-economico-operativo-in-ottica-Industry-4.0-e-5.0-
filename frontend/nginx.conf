# nginx serve la build di Angular e inoltra le chiamate /api al back-end:
# il browser vede un solo indirizzo e non serve CORS.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Applicazione a pagina singola: i percorsi sconosciuti tornano a index.html (routing di Angular).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
