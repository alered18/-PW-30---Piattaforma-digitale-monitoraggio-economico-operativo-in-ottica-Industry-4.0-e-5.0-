[project]
name = "pw30-generator"
version = "0.1.0"
description = "Generatore di dati simulati della linea del pastificio (PW 30): parla solo con le API del back-end"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "tzdata>=2024.1",  # fusi orari IANA anche su Windows
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "config", "client_api"]
packages = ["simulatore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
